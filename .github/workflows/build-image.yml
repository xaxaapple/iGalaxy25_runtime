# Build the OneiOS image set (iOS 27.0.1 24A446, iPhone18,2) on a GitHub runner and hand it over in parts.
#
# The image is made from Apple's IPSW, fetched here from Apple's CDN with scripts/fetch/fetch.sh, exactly as on your
# own PC (docs/building.md sections 1 to 3). It is Apple's software: it is never committed and never put in a
# release. Delivery is a private hand-over to you: the .tar.zst is cut into parts (default 1900 MB) that go to
#   - gofile.io (an unlisted link; the page and the parts' links are printed in the run's summary), and/or
#   - the run's artifacts (parts, 3 days; the account's artifact storage must have room for ~11 GB).
# Anyone who has a gofile link can download it: do not post the link.
#
# This is the workflow for the current tree (Rust oneios-tool, XnuPrelink pin 9b950f2 with stub relocation).
# Put the parts together on the phone or PC:  cat OneiOS_*.tar.zst.part-* > OneiOS_iOS27.0.1_24A446_iPhone18-2.tar.zst
# and check it:  sha256sum -c OneiOS_iOS27.0.1_24A446_iPhone18-2.tar.zst.sha256
# Disk: about 60 GB at the peak (IPSW 11 + sources and kernel build + image 11 + its tar 11); the runner has ~93 GB free
# once the preinstalled toolchains are removed (first step).
name: build-image
on:
  workflow_dispatch:
    inputs:
      delivery:
        description: "Where the parts go: gofile, artifact or both"
        default: gofile
        type: choice
        options: [gofile, artifact, both]
      part_mb:
        description: "Part size in MB"
        default: "1900"
      panic_addrs:
        description: Guest kernel addresses (a panic's frames) to resolve in kernel.kc, space-separated
        required: false
        default: ""
        type: string
      metal:
        description: "Build the Metal plug-in (NativeAdrenoMetal.bundle) and put it in the image; without it backboardd composites on the CPU (the slide show). Adds about 1-2 h"
        type: boolean
        default: true
      no_hook:
        description: "Build the image without the userland hook (the seed is the OS volume's own /private/var)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      P: profiles/ios-27.0.1-iPhone18,2.toml
      NAME: OneiOS_iOS27.0.1_24A446_iPhone18-2
      # anonymous GitHub API calls (UniXNU's prepare-xnu-source.py) hit the per-address rate limit on hosted runners
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore executable bits (an upload drops them)
        run: git ls-files -z | xargs -0 grep -lZI '^#!' 2>/dev/null | xargs -0 -r chmod +x
      - name: Free disk (preinstalled toolchains this job does not use)
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean || true
          df -h /
      - name: Tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd clang lld llvm python3 python3-pip python3-yaml git curl patch xz-utils bzip2 \
            cmake g++ make pkg-config fuse3 libfuse3-dev libicu-dev libbz2-dev zlib1g-dev libattr1-dev qemu-user jq \
            ninja-build flex bison m4 autoconf automake libtool bubblewrap libblocksruntime-dev libbsd-dev uuid-dev
          # Ubuntu 24.04 runners block unprivileged user namespaces (bubblewrap, used by the kernel build)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # libdispatch: Ubuntu 24.04 has no libdispatch-dev package (the old one was dropped), so take the distro's if it
          # exists and otherwise build swift-corelibs-libdispatch into /usr/local (kernel/linux/setup-toolchain.sh needs it)
          if ! sudo apt-get install -y libdispatch-dev; then
            git clone --depth 1 --branch swift-6.0-RELEASE https://github.com/swiftlang/swift-corelibs-libdispatch.git /tmp/libdispatch
            cmake -S /tmp/libdispatch -B /tmp/libdispatch/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DENABLE_SWIFT=OFF -DBUILD_TESTING=OFF \
              -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build /tmp/libdispatch/build -j"$(nproc)"
            sudo cmake --install /tmp/libdispatch/build
            echo /usr/local/lib | sudo tee /etc/ld.so.conf.d/local-dispatch.conf
          fi
          sudo ldconfig
          ldconfig -p | grep -E 'libdispatch|libBlocksRuntime'
          # bubblewrap >= 0.11: the kernel build uses --overlay-src/--tmp-overlay; Ubuntu 24.04 ships 0.9.0 without them
          sudo apt-get install -y meson libcap-dev
          git clone --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bubblewrap
          meson setup /tmp/bubblewrap/build /tmp/bubblewrap -Dman=disabled -Dselinux=disabled -Dtests=false --prefix=/usr/local
          ninja -C /tmp/bubblewrap/build
          sudo ninja -C /tmp/bubblewrap/build install
          hash -r
          /usr/local/bin/bwrap --version
          /usr/local/bin/bwrap --help 2>&1 | grep -c overlay-src
          # apfs-fuse: reads the OS volume read-only, without root (docs/building.md section 0)
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)"
          sudo install /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/apfs-fuse
          # lzfse: kernel-inputs.sh decompresses the kernelcache with the lzfse CLI
          git clone --depth 1 https://github.com/lzfse/lzfse.git /tmp/lzfse
          cmake -S /tmp/lzfse -B /tmp/lzfse/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/lzfse/build -j"$(nproc)"
          sudo install /tmp/lzfse/build/lzfse /usr/local/bin/lzfse
          command -v lzfse apfs-fuse zstd python3
          # Rust: tools/oneios-tool (the image, prelink and kernel tools; docs/building.md section 10) needs 1.88 or newer
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo build --release --manifest-path tools/oneios-tool/Cargo.toml
          tools/oneios-tool/target/release/oneios-tool --help | head -5
          # clang 23 (the version this kernel was built and tested with, kernel/README.md). Ubuntu 24.04 has clang 18, and
          # upstream clang before 22 does not turn pointer authentication on for an arm64e Apple triple by itself, so
          # __builtin_ptrauth_strip then fails with "this target does not support pointer authentication".
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y clang-23 lld-23 llvm-23
          sudo ln -sf /usr/bin/clang-23 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-23 /usr/local/bin/clang++
          # The kernel's archive builders call llvm-objcopy/llvm-nm on Mach-O objects; the version 18 ones refuse
          # (`llvm-objcopy: error: option is not supported for MachO`). Put the 23 tools first in PATH.
          for t in /usr/lib/llvm-23/bin/llvm-* /usr/lib/llvm-23/bin/ld.lld /usr/lib/llvm-23/bin/lld; do
            sudo ln -sf "$t" "/usr/local/bin/$(basename "$t")"
          done
          hash -r
          llvm-objcopy --version | head -3
          clang --version
          echo 'void *f(void *p) { return __builtin_ptrauth_strip(p, 0); }' | clang -target arm64e-apple-ios27 -fptrauth-function-pointer-type-discrimination -x c -c - -o /dev/null
          sudo sh -c 'echo user_allow_other >> /etc/fuse.conf' || true
      - name: Sources of the kernel and of the references
        run: |
          set -euxo pipefail
          scripts/setup/get-references.sh
          kernel/fetch.sh
      - name: Apple's IPSW members (about 10.6 GiB, from Apple's CDN)
        run: |
          set -euxo pipefail
          scripts/fetch/get-ipsw-cli.sh
          scripts/fetch/fetch.sh "$P"
          scripts/image/kernel-inputs.sh "$P"
          df -h /
      - name: Hosted kernel
        run: |
          set -euxo pipefail
          # XNU_FILESET_REFERENCE=1 also builds the RELEASE kernel with symbols that the prelink pairs Apple's kexts against
          # (kernel/prelink/README.md: worth ~4,800 more paired functions; without it a kext calls an unpaired kernel
          # function and the guest panics "original component called an unmapped kernel function")
          env HOSTED_OUT=ci XNU_FILESET_REFERENCE=1 kernel/build-hosted.sh
      - name: Kernel logs (only on failure)
        if: failure()
        run: |
          L=$(ls -d out/kernel-hosted-ci/unixnu/oneios/*/oneios_hosted/logs 2>/dev/null | head -1 || true)
          [ -n "$L" ] || { echo "no logs dir"; exit 0; }
          ls -l "$L"
          for f in "$L"/*.log; do
            echo "=== $f (errors) ==="
            grep -n -m 60 -E "error|Error|fatal|No such file|not found|undefined|\*\*\*" "$f" || true
            echo "=== $f (last 60 lines) ==="
            tail -n 60 "$f"
          done
          mkdir -p kernel-logs && cp "$L"/*.log kernel-logs/ 2>/dev/null || true
      - name: Upload kernel logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-logs
          path: kernel-logs
          if-no-files-found: ignore
      - name: Kernel collection (kernel.kc)
        run: |
          set -euxo pipefail
          REF=out/kernel/current-hosted-ci/reference.macho
          ls -l "$REF" out/kernel/current-hosted-ci/xnu.macho
          env KERNEL=out/kernel/current-hosted-ci/xnu.macho REFERENCE="$PWD/$REF" kernel/prelink/build.sh
          ls -l out/kernel/24A446/kernel.kc
      - name: Kernel collection map (oneios-tool sym kernel)
        if: always()
        run: |
          KC=out/kernel/24A446/kernel.kc
          [ -f "$KC" ] || { echo "no kernel.kc"; exit 0; }
          mkdir -p kc-map
          T=tools/oneios-tool/target/release/oneios-tool
          "$T" sym kernel index > kc-map/index.txt 2>&1 || true
          if [ -n "${{ inputs.panic_addrs }}" ]; then
            "$T" sym kernel ${{ inputs.panic_addrs }} > kc-map/addresses.txt 2>&1 || true
            cat kc-map/addresses.txt
          fi
      - name: Upload kernel collection map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kc-map
          path: kc-map
          if-no-files-found: ignore
      - name: Metal plug-in - tools (Rust 1.98.0, Mesa and metal2vulkan build dependencies)
        if: ${{ inputs.metal && !inputs.no_hook }}
        run: |
          set -euxo pipefail
          sudo apt-get install -y glslang-tools glslc spirv-tools python3-mako python3-yaml python3-ply bison flex \
            pkg-config zlib1g-dev libexpat1-dev libzstd-dev rsync p7zip-full cmake ninja-build
          # Mesa (cecc0e9) wants meson 1.4 or newer; Ubuntu's apt has 1.3.2
          sudo pip3 install --break-system-packages 'meson>=1.5,<2'
          hash -r; meson --version
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install 1.98.0 --profile minimal
          rustup +1.98.0 component add rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc +1.98.0 --version
      - name: Metal plug-in - iOS SDK headers (public collection of Apple SDKs, xybp888/iOS-SDKs)
        if: ${{ inputs.metal && !inputs.no_hook }}
        run: |
          set -euxo pipefail
          # The build uses the SDK's headers only; what the guest exports comes from its own shared cache (the stubs).
          # Newest first (27.2, 27.1, 27.0), the owner's 26.5 as the last resort. A release asset is iPhoneOS<ver>.sdk.zip;
          # a zip made on a Mac also holds __MACOSX/ resource-fork stubs, which are not the SDK and are skipped.
          SDK=""
          for ver in 27.2 27.1 27.0 26.5; do
            rm -rf ios-sdk && mkdir -p ios-sdk/dl ios-sdk/x
            tag=$(gh release list -R xybp888/iOS-SDKs --limit 40 --json tagName -q '.[].tagName' | grep -E "^iOS${ver}-?SDKs$" | head -1 || true)
            [ -n "$tag" ] || continue
            (cd ios-sdk/dl && gh release download "$tag" -R xybp888/iOS-SDKs --pattern 'iPhoneOS*' && ls -l) || continue
            for f in ios-sdk/dl/*; do
              case "$f" in
                *.zip) unzip -q -o "$f" -d ios-sdk/x -x '__MACOSX/*' || true ;;
                *.tar.gz|*.tgz) tar xzf "$f" -C ios-sdk/x ;;
                *.tar.xz) tar xJf "$f" -C ios-sdk/x ;;
                *.7z) 7z x -y -oios-sdk/x "$f" ;;
              esac
            done
            SDK=$(find ios-sdk/x -maxdepth 6 -type d -name "iPhoneOS${ver}*.sdk" -not -path '*__MACOSX*' | head -1 || true)
            if [ -n "$SDK" ] && [ -f "$SDK/usr/include/stdio.h" ]; then break; fi
            echo "SDK $ver: no usable iPhoneOS${ver}.sdk in the asset"; find ios-sdk/x -maxdepth 3 | head -20; SDK=""
          done
          [ -n "$SDK" ] || { echo "no iOS SDK from xybp888/iOS-SDKs"; exit 1; }
          SDK=$(readlink -f "$SDK")
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"
          echo "iOS SDK: $SDK"; du -sh "$SDK"
      - name: Metal plug-in - image set pass 1 (no hook, no archive; the iOS 27 stubs come from its shared cache)
        if: ${{ inputs.metal && !inputs.no_hook }}
        run: |
          set -euxo pipefail
          scripts/image/build.sh "$P" --kernel out/kernel/24A446/kernel.kc --no-hook --no-pack
          df -h /
      - name: Metal plug-in - ld64 with TAPI and the iOS 27 stubs
        if: ${{ inputs.metal && !inputs.no_hook }}
        run: |
          set -euxo pipefail
          scripts/setup/ios-toolchain.sh --ld
          # The stubs of all 4696 images of the cache take hours on a runner: ipsw reads the cache from the apfs-fuse mount for
          # every image (docs/gpu.md: from a local copy it is much faster), and on 2 to 4 cores the 6 minutes of 20 threads
          # become 1.5 hours or more. The link needs the public libraries (usr/lib, the top of System/Library/Frameworks)
          # and what they re-export (their .tbd name it): that closure is made, from a local copy of the cache.
          M=$(mktemp -d)
          apfs-fuse -o ro out/image/24A446/systemos.img "$M"
          mkdir -p out/ios27-cache
          cp -a "$M"/root/System/Library/Caches/com.apple.dyld/. out/ios27-cache/
          fusermount3 -u "$M" || fusermount -u "$M" || true
          du -sh out/ios27-cache; df -h /
          C=out/ios27-cache/dyld_shared_cache_arm64e
          out/bin/ipsw dyld info --dylibs --json "$C" | jq -r '.dylibs[].name' | sort -u > ios27-images.txt
          wc -l ios27-images.txt
          grep -E '^/usr/lib/[^/]+\.dylib$|^/usr/lib/system/|^/System/Library/Frameworks/[^/]+\.framework/[^/]+$' ios27-images.txt > ios27-want.txt
          for round in 1 2 3 4 5 6; do
            wc -l < ios27-want.txt
            scripts/setup/ios-toolchain.sh --tbd --cache "$C" $(cat ios27-want.txt) || true
            # what the stubs re-export, that is an image of the cache and has no stub yet
            : > ios27-more.txt
            while IFS= read -r t; do
              awk '/^reexported-libraries:/{on=1;next} /^[a-z-]+:/{on=0} on' "$t" | grep -o '/[^ ,]*' | tr -d ']' || true
            done < <(find out/ios27-tbd -name '*.tbd' -type f) | sort -u | grep -Fxf ios27-images.txt > ios27-re.txt || true
            grep -Fxvf ios27-want.txt ios27-re.txt > ios27-more.txt || true
            [ -s ios27-more.txt ] || break
            cat ios27-more.txt >> ios27-want.txt
          done
          find out/ios27-tbd -name '*.tbd' | wc -l
          scripts/setup/ios-toolchain.sh
          scripts/setup/ios-toolchain.sh --test
      - name: Metal plug-in - build (Turnip, the metal2vulkan bridge, the plug-in)
        if: ${{ inputs.metal && !inputs.no_hook }}
        run: |
          set -euxo pipefail
          userland/metal/build.sh
          ls -l out/userland/NativeAdrenoMetal.bundle
          cat out/userland/NativeAdrenoMetal.check.txt || true
      - name: Metal plug-in - logs and bundle record (always)
        if: ${{ always() && inputs.metal && !inputs.no_hook }}
        run: |
          mkdir -p metal-logs
          cp out/userland/NativeAdrenoMetal.build.json out/userland/NativeAdrenoMetal.check.txt metal-logs/ 2>/dev/null || true
          find out/metal -name '*.log' -size -20M -exec cp --parents {} metal-logs/ \; 2>/dev/null || true
          ls -R metal-logs | head -50
      - name: Upload Metal plug-in logs
        if: ${{ always() && inputs.metal && !inputs.no_hook }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-logs
          path: metal-logs
          if-no-files-found: ignore
      - name: Image set
        run: |
          set -euxo pipefail
          hook=""
          [ "${{ inputs.no_hook }}" = true ] && hook="--no-hook"
          scripts/image/build.sh "$P" --kernel out/kernel/24A446/kernel.kc $hook
          scripts/image/verify.sh "out/image/$NAME.tar.zst"
          # Not needed any more: free the room for the parts.
          rm -rf inputs out/kernel out/kernel-inputs "out/image/24A446" external
          df -h /
      - name: Parts
        run: |
          set -euxo pipefail
          mkdir -p parts
          mv "out/image/$NAME.tar.zst" "out/image/$NAME.tar.zst.sha256" parts/
          cd parts
          split -b "${{ inputs.part_mb }}M" -d -a 3 "$NAME.tar.zst" "$NAME.tar.zst.part-"
          rm "$NAME.tar.zst"
          sha256sum "$NAME".tar.zst.part-* > "$NAME.parts.sha256"
          ls -l
      - name: gofile
        if: inputs.delivery != 'artifact'
        run: |
          set -euo pipefail
          cd parts
          # A guest upload makes a folder; the later parts go into it with the guest token (api.gofile.io, as documented).
          up() { # FILE [folderId token]
            for try in 1 2 3 4 5; do
              if [ -n "${2:-}" ]; then
                r=$(curl -fsS --retry 3 -H "Authorization: Bearer $3" -F "folderId=$2" -F "file=@$1" https://upload.gofile.io/uploadfile) && break
              else
                r=$(curl -fsS --retry 3 -F "file=@$1" https://upload.gofile.io/uploadfile) && break
              fi
              echo "upload of $1 failed (try $try)"; sleep 20; r=""
            done
            [ -n "$r" ] || { echo "gofile: $1 not uploaded" >&2; return 1; }
            echo "$r"
          }
          first=1; folder=""; token=""; page=""
          for f in "$NAME".tar.zst.sha256 "$NAME.parts.sha256" "$NAME".tar.zst.part-*; do
            if [ $first = 1 ]; then
              r=$(up "$f"); folder=$(echo "$r" | jq -r '.data.parentFolder'); token=$(echo "$r" | jq -r '.data.guestToken'); page=$(echo "$r" | jq -r '.data.downloadPage'); first=0
            else
              up "$f" "$folder" "$token" >/dev/null
            fi
            echo "uploaded $f"
          done
          echo "gofile: $page"
          { echo "### gofile"; echo; echo "$page"; echo; echo "Parts: \`cat $NAME.tar.zst.part-* > $NAME.tar.zst\`, then \`sha256sum -c $NAME.tar.zst.sha256\`."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.delivery != 'gofile'
        with:
          name: oneios-image-parts
          path: parts/
          retention-days: 3
          compression-level: 0
